name: Step 0 audit verification

on:
  push:
    branches:
      - audit/step0-verification
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[audit-output]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/step0-verification
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and rebuild from clean checkout
        run: |
          python -m pip install -r requirements.txt
          python scripts/generate_simulated_data.py
          python scripts/build_analysis_outputs.py
      - name: Build verification report
        run: |
          mkdir -p audit
          python - <<'PY' > audit/step0_report.txt
          import pandas as pd
          import subprocess

          df=pd.read_csv("data/simulated_fulfillment_orders.csv",parse_dates=["order_date"])
          pre=df[(df.retailer=="Retailer C") & (df.order_date < "2026-09-01")]
          sep=df[df.order_date >= "2026-09-01"]
          c=sep[sep.retailer=="Retailer C"]
          peers=sep[sep.retailer!="Retailer C"]
          months=(df[df.retailer=="Retailer C"].assign(month=lambda x:x.order_date.dt.to_period("M").astype(str))
                  .groupby("month").agg(orders=("order_id","size"),cancellations=("cancelled","sum"),rate=("cancelled","mean")))
          peer_rate=peers.cancelled.mean()
          pre_rate=pre.cancelled.mean()
          print("STEP 0 CLEAN-RUN VERIFICATION")
          print("=============================")
          print(f"rows={len(df)}")
          for m,row in months.iterrows():
              print(f"Retailer C {m}: orders={int(row.orders)} cancellations={int(row.cancellations)} rate={row.rate*100:.10f}%")
          print(f"Peers Sep excl C: orders={len(peers)} cancellations={int(peers.cancelled.sum())} rate={peer_rate*100:.10f}%")
          print(f"Gap vs peers pp={(c.cancelled.mean()-peer_rate)*100:.10f}")
          print(f"Excess vs peers={c.cancelled.sum()-len(c)*peer_rate:.10f}")
          print(f"Retailer C Jul-Aug: orders={len(pre)} cancellations={int(pre.cancelled.sum())} rate={pre_rate*100:.10f}%")
          print(f"Excess vs own Jul-Aug={c.cancelled.sum()-len(c)*pre_rate:.10f}")
          for dp,g in c.groupby("daypart"):
              print(f"C Sep {dp}: n={len(g)} cancels={int(g.cancelled.sum())} rate={g.cancelled.mean()*100:.10f}%")
          canc=c[c.cancelled==1]
          rc=(canc.cancellation_reason=="retailer_driven").sum()
          oos=(canc.cancellation_type=="retailer initiated out of stock").sum()
          closures=canc[canc.cancellation_type=="store early closure"]
          print(f"Retailer-driven: {rc}/{len(canc)} = {rc/len(canc)*100:.10f}%")
          print(f"Retailer-initiated OOS: {oos}/{len(canc)} = {oos/len(canc)*100:.10f}%")
          print(f"Early closures evening: {(closures.daypart=='Evening').sum()}/{len(closures)}")
          alerts=pd.read_csv("data/alert_counts_by_retailer.csv")
          print("\nALERT COUNTS")
          print(alerts.to_string(index=False))
          print("\nCOMMITTED OUTPUT DIFF AFTER REBUILD")
          diff=subprocess.run(["git","diff","--","data"],capture_output=True,text=True).stdout
          print(diff if diff.strip() else "NO DIFF")
          PY
      - name: Print verification report
        run: |
          cat audit/step0_report.txt
          for f in data/impact_baselines.csv data/statistical_tests.csv data/root_cause_change_by_reason.csv data/root_cause_change_by_type.csv data/store_concentration_summary.csv data/retailer_c_store_adjusted_excess.csv data/monitor_alert_summary.csv data/headline_metrics.csv; do
            echo "===== $f ====="
            cat "$f"
          done

      - name: Commit generated analytical outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u data tableau_ready
          git ls-files --others --exclude-standard data tableau_ready | xargs -r git add --
          if git diff --cached --quiet; then
            echo "No generated output changes to commit."
          else
            git commit -m "data: refresh audited analytical outputs [generated]"
            git pull --rebase origin audit/step0-verification
            git push origin HEAD:audit/step0-verification
          fi
